# Replace portfolio.example.com and certificate paths before enabling.
# Certbot webroot can issue/renew certificates through the HTTP challenge path.
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.example.com;
    ssl_certificate /etc/letsencrypt/live/portfolio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 11m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Forwarded headers are overwritten, not appended to untrusted client input.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # API documentation and actuator are available only from the VPS itself.
    location ~ ^/(actuator|v3/api-docs|swagger-ui)(/|$) { return 404; }
    location ~ ^/api/v1/(openapi|docs)(/|$) { return 404; }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
